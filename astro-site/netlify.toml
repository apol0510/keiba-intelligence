# Netlify Configuration File
# KEIBA Intelligence - AI-Powered Intelligence Dashboard for 南関競馬

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ビルド最適化
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ヘッダー設定（セキュリティ）
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 静的アセットのキャッシュ
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions設定
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["airtable", "@sendgrid/mail"]
  # SSR で horseHistories / featureScores / entries JSON を読むため Function bundle に同梱する
  # (path は netlify.toml と同じ astro-site/ からの相対)。
  # entries（南関出馬表）は F5 馬詳細表示で SSR runtime に fs 読みするため追加（表示接続は F5f）。
  included_files = ["src/data/horseHistories/**", "src/data/featureScores/**", "src/data/recentHorseHistories/**", "src/data/entries/**", "src/data/horseStats/**"]

# プラグイン
[[plugins]]
  package = "@netlify/plugin-sitemap"

# コンテキスト別設定
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# 環境変数（実際の値はNetlify UIで設定）
# AIRTABLE_API_KEY
# AIRTABLE_BASE_ID
# AIRTABLE_TABLE_NAME
# SENDGRID_API_KEY
# BREVO_API_KEY
# THRIVECART_WEBHOOK_SECRET

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 独自ドメインへの恒久リダイレクト (netlify.app サブドメイン → keiba-intelligence.jp)
# パス・クエリを維持したまま 301 で転送。最優先で評価されるよう redirect 一覧の先頭に置く。
# 独自ドメイン (keiba-intelligence.jp) 側は from に含めないためループしない。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[redirects]]
  from = "https://keiba-intelligence.netlify.app/*"
  to = "https://keiba-intelligence.jp/:splat"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# URL 再編 (中央/南関を /archive 配下・/free-prediction 配下の対称階層へ)
# 旧URLは 301 で新URLへ恒久移動
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# --- archive: /archive-jra/* → /archive/jra/:splat ---
[[redirects]]
  from = "/archive-jra/*"
  to = "/archive/jra/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive-jra"
  to = "/archive/jra/"
  status = 301
  force = true

# --- archive 南関: /archive/{year}/* → /archive/nankan/{year}/:splat ---
[[redirects]]
  from = "/archive/2024/*"
  to = "/archive/nankan/2024/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive/2025/*"
  to = "/archive/nankan/2025/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive/2026/*"
  to = "/archive/nankan/2026/:splat"
  status = 301
  force = true

# --- free-prediction 中央: /free-prediction-jra/* → /free-prediction/jra/:splat ---
[[redirects]]
  from = "/free-prediction-jra/*"
  to = "/free-prediction/jra/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/free-prediction-jra"
  to = "/free-prediction/jra/"
  status = 301
  force = true

# --- free-prediction 南関: 旧 /free-prediction（南関単体ページ）→ /free-prediction/nankan/ ---
# 注: /free-prediction/ (新ハブ) と /free-prediction/jra/, /free-prediction/nankan/ は別物
# 旧南関個別記事 /free-prediction/{slug} は /free-prediction/nankan/{slug} に
[[redirects]]
  from = "/free-prediction/archive"
  to = "/free-prediction/nankan/archive"
  status = 301
  force = true

# --- prediction (有料): /prediction-jra/* → /prediction/jra/:splat ---
[[redirects]]
  from = "/prediction-jra/*"
  to = "/prediction/jra/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/prediction-jra"
  to = "/prediction/jra"
  status = 301
  force = true

# --- prediction (有料) 南関: 旧 /prediction（南関単体ページ）→ /prediction/nankan ---
# 注: /prediction/{slug}（個別レース詳細）は維持。/prediction (裸URL) のみリダイレクト
[[redirects]]
  from = "/prediction"
  to = "/prediction/nankan"
  status = 301
  force = true
