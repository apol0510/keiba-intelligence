# Netlify Configuration File
# KEIBA Intelligence - AI-Powered Intelligence Dashboard for 南関競馬

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ビルド最適化
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ヘッダー設定（セキュリティ）
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# 静的アセットのキャッシュ
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions設定
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["airtable", "@sendgrid/mail", "stripe"]
  # [functions] included_files は**意図的に持たない**（2026-07-30）。
  #
  # SSR Function への同梱は次の2経路だけで足りることを実測で確認した。
  #   1. astro.config.mjs の adapter includeFiles
  #      → horseHistories / horseStats / recentHorseHistories / entries / predictions（2026-10-22 から明示）
  #   2. @astrojs/netlify の依存トレース（`join(process.cwd(), 'src','data', …)` の静的解析）
  #      → featureScores / archiveResults*
  #   （predictions は以前 SSR の sitemap.xml.js 経由のトレースで偶然同梱されていた。sitemap の prerender 化に伴い明示した）
  # ここに全ディレクトリの glob を残すと、ビルド後の
  # `npm run prune:function-data`（scripts/pruneFunctionBundleData.mjs）で落とした過去日データを
  # deploy 時に repo から再同梱してしまい、Lambda のサイズ上限超過（deploy 400）が再発しうる。
  # 同梱範囲を変えたい場合は prune スクリプトの DATASETS で一元管理すること。

# プラグイン
# 🔴 2026-10-22 `@netlify/plugin-sitemap` を外した（docs/measurements/TRAFFIC_GROWTH_2026_10.md §2.1）。
#    plugin は dist の静的 HTML だけから sitemap.xml を作り、SSR の主要ページ（/free-prediction/jra・
#    /free-prediction/nankan・/pricing・/register・開催日別の無料予想・月別アーカイブ）が載らず、
#    Google 確認ファイルや /login が載っていた。sitemap は src/pages/sitemap.xml.js（prerender）が唯一の生成元。

# コンテキスト別設定
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# 環境変数（実際の値はNetlify UIで設定）
# AIRTABLE_API_KEY
# AIRTABLE_BASE_ID
# AIRTABLE_TABLE_NAME
# SENDGRID_API_KEY
# BREVO_API_KEY
# THRIVECART_WEBHOOK_SECRET

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 独自ドメインへの恒久リダイレクト (netlify.app サブドメイン → keiba-intelligence.jp)
# パス・クエリを維持したまま 301 で転送。最優先で評価されるよう redirect 一覧の先頭に置く。
# 独自ドメイン (keiba-intelligence.jp) 側は from に含めないためループしない。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[redirects]]
  from = "https://keiba-intelligence.netlify.app/*"
  to = "https://keiba-intelligence.jp/:splat"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# URL 再編 (中央/南関を /archive 配下・/free-prediction 配下の対称階層へ)
# 旧URLは 301 で新URLへ恒久移動
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# --- archive: /archive-jra/* → /archive/jra/:splat ---
# 裸の URL を先に評価する（後ろに置くと "/archive-jra/*" の空 splat が先に一致し、スラッシュ付きへ転送されていた・2026-10-22）
[[redirects]]
  from = "/archive-jra"
  to = "/archive/jra"
  status = 301
  force = true

[[redirects]]
  from = "/archive-jra/*"
  to = "/archive/jra/:splat"
  status = 301
  force = true

# --- archive 南関: /archive/{year}/* → /archive/nankan/{year}/:splat ---
[[redirects]]
  from = "/archive/2024/*"
  to = "/archive/nankan/2024/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive/2025/*"
  to = "/archive/nankan/2025/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/archive/2026/*"
  to = "/archive/nankan/2026/:splat"
  status = 301
  force = true

# --- free-prediction 中央: /free-prediction-jra/* → /free-prediction/jra/:splat ---
# 裸の URL を先に評価する（後ろに置くと "/free-prediction-jra/*" の空 splat が先に一致し、スラッシュ付きへ転送されていた・2026-10-22）
[[redirects]]
  from = "/free-prediction-jra"
  to = "/free-prediction/jra"
  status = 301
  force = true

[[redirects]]
  from = "/free-prediction-jra/*"
  to = "/free-prediction/jra/:splat"
  status = 301
  force = true

# --- free-prediction 南関: 旧 /free-prediction（南関単体ページ）→ /free-prediction/nankan/ ---
# 注: /free-prediction/ (新ハブ) と /free-prediction/jra/, /free-prediction/nankan/ は別物
# 旧南関個別記事 /free-prediction/{slug} は /free-prediction/nankan/{slug} に
[[redirects]]
  from = "/free-prediction/archive"
  to = "/free-prediction/nankan/archive"
  status = 301
  force = true

# --- prediction (有料): /prediction-jra/* → /prediction/jra/:splat ---
[[redirects]]
  from = "/prediction-jra/*"
  to = "/prediction/jra/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/prediction-jra"
  to = "/prediction/jra"
  status = 301
  force = true

# --- prediction (有料) 南関: 旧 /prediction（南関単体ページ）→ /prediction/nankan ---
# 注: /prediction/{slug}（個別レース詳細）は維持。/prediction (裸URL) のみリダイレクト
[[redirects]]
  from = "/prediction"
  to = "/prediction/nankan"
  status = 301
  force = true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 静的生成ページを末尾スラッシュなしの URL で直接 200 にする（2026-10-22・TRAFFIC_GROWTH_2026_10.md §2.1）
#
# astro.config.mjs は trailingSlash: 'never' で、canonical・sitemap・内部リンクはすべて「/about」形式。
# しかし prerender のページは dist/about/index.html として出力され、Netlify は「/about」を
# 「/about/」へ 301 していた（canonical が転送される URL を指し、内部リンクのたびに 1 往復増える）。
# ここで「/about」を同じ index.html へ内部 rewrite（200）する。末尾スラッシュ付きも同じ規則に一致して 200。
# 🔴 ページの中身・canonical・認可は不変。rollback はこのブロックの削除だけ。
# 🔴 prerender のページを増減したら src/lib/seo/sitemap.test.mjs の PRERENDERED_REWRITES と合わせる。
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200
  force = true

