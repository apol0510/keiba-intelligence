name: Import Results (中央競馬)

on:
  repository_dispatch:
    types: [results-jra-updated]
  workflow_dispatch:
    inputs:
      date:
        description: '日付 (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Import JRA results and verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_ENDPOINT: https://keiba-intelligence.netlify.app/.netlify/functions/send-alert
          CI: 'true'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/importResultsJra.js --date "${{ github.event.inputs.date }}"
          else
            node scripts/importResultsJra.js
          fi

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/archiveResultsJra.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COMMIT_DATE="${{ github.event.inputs.date }}"
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            fi
            git commit -m "Auto-verify: ${COMMIT_DATE} JRA results from keiba-data-shared"

            # Retry logic: pull --rebase and push (最大5回リトライ)
            MAX_RETRIES=5
            RETRY_COUNT=0
            SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
              echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Pulling latest changes..."

              # rebase中の競合を検出してabort
              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                echo "⚠️  rebase中の競合を検出してabort..."
                git rebase --abort || true
              fi

              # マージ競合状態をチェック
              if git ls-files -u | grep -q .; then
                echo "⚠️  未マージファイルを検出してabort..."
                git merge --abort || true
              fi

              # mainブランチに強制チェックアウト
              git checkout -f main 2>/dev/null || git checkout main
              git fetch origin main
              git reset --hard origin/main
              git clean -fd

              # 再度コミット（ファイルが存在する場合）
              if [ -f "src/data/archiveResultsJra.json" ]; then
                git add src/data/archiveResultsJra.json
                git commit -m "Auto-verify: ${COMMIT_DATE} JRA results from keiba-data-shared" || echo "Already committed"
              fi

              # Pull and push
              git fetch origin main
              if git pull --rebase origin main; then

                # 競合チェック
                if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                  echo "⚠️  rebase競合を検出、ours戦略で自動解決..."

                  # 競合ファイルをチェック
                  if git ls-files -u | grep -q "archiveResultsJra.json"; then
                    echo "📝 archiveResultsJra.json の競合を自動解決（ours戦略）"
                    git checkout --ours src/data/archiveResultsJra.json
                    git add src/data/archiveResultsJra.json
                    git rebase --continue || {
                      echo "❌ rebase --continue失敗、abort"
                      git rebase --abort
                      git checkout main
                      git reset --hard origin/main
                    }
                  else
                    echo "❌ 競合ファイルが見つからない、abort"
                    git rebase --abort
                    git checkout main
                    git reset --hard origin/main
                  fi
                fi

                # Push試行
                if git push origin main; then
                  echo "✅ Push成功"
                  SUCCESS=true
                else
                  echo "⚠️  Push失敗、リトライ..."
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  sleep $((RETRY_COUNT * 2))
                fi
              else
                echo "⚠️  Pull --rebase失敗"
                RETRY_COUNT=$((RETRY_COUNT + 1))
                sleep $((RETRY_COUNT * 2))
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ $MAX_RETRIES回のリトライ後も失敗"
              exit 1
            fi
          fi
