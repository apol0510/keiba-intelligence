name: Import Prediction (南関競馬)

on:
  repository_dispatch:
    types: [prediction-updated]
  workflow_dispatch:
    inputs:
      date:
        description: '日付 (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Import prediction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/importPrediction.js --date "${{ github.event.inputs.date }}"
          else
            node scripts/importPrediction.js
          fi

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/predictions/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            COMMIT_DATE="${{ github.event.inputs.date }}"
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            fi
            git commit -m "Auto-import: ${COMMIT_DATE} prediction from keiba-data-shared"

            # Retry logic: pull --rebase and push (最大5回リトライ)
            MAX_RETRIES=5
            RETRY_COUNT=0
            SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
              echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Pulling latest changes..."

              # mainブランチにいることを確認
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              if [ "$CURRENT_BRANCH" != "main" ]; then
                echo "⚠️  Not on main branch (current: $CURRENT_BRANCH), checking out main..."
                git checkout main
              fi

              # rebase中の競合を検出してabort + クリーンアップ
              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                echo "⚠️  Detected ongoing rebase, aborting..."
                git rebase --abort || true
                git checkout main || true
                git reset --hard HEAD || true
                git clean -fd || true
              fi

              # マージ競合状態をチェック
              if git ls-files -u | grep -q .; then
                echo "⚠️  Detected unmerged files, resetting..."
                git reset --merge || true
                git checkout main || true
                git reset --hard HEAD || true
                git clean -fd || true
              fi

              # 最新状態を取得（rebase）
              if git pull --rebase origin main; then
                echo "✅ Successfully pulled latest changes"

                # プッシュ試行
                if git push; then
                  echo "✅ Successfully pushed changes"
                  SUCCESS=true
                else
                  echo "⚠️  Push failed, retrying..."
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  sleep $((RETRY_COUNT * 2))  # Exponential backoff
                fi
              else
                # rebase失敗時の処理
                echo "⚠️  Pull --rebase failed"

                # 競合が発生している場合は自動解決を試みる
                if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                  echo "🔧 Attempting to resolve conflicts automatically..."

                  # 競合ファイルをチェック
                  CONFLICT_FILES=$(git diff --name-only --diff-filter=U || true)

                  if [ -n "$CONFLICT_FILES" ]; then
                    echo "   Conflicted files: $CONFLICT_FILES"

                    # 予想データファイルの競合のみ自動解決（ours戦略: 自分の変更を優先）
                    for FILE in $CONFLICT_FILES; do
                      if [[ "$FILE" == src/data/predictions/* ]]; then
                        echo "   Resolving $FILE (using ours strategy)"
                        git checkout --ours "$FILE" || true
                        git add "$FILE" || true
                      fi
                    done

                    # rebase続行
                    if git rebase --continue; then
                      echo "✅ Conflicts resolved, rebase continued"
                      # 次のループでpush試行
                      continue
                    else
                      echo "❌ Failed to continue rebase"
                      git rebase --abort || true
                      git checkout main || true
                      git reset --hard origin/main || true
                      git clean -fd || true
                    fi
                  else
                    echo "❌ No conflict files found but rebase failed"
                    git rebase --abort || true
                    git checkout main || true
                    git reset --hard origin/main || true
                    git clean -fd || true
                  fi
                fi

                RETRY_COUNT=$((RETRY_COUNT + 1))
                sleep $((RETRY_COUNT * 2))
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ Failed to push after $MAX_RETRIES attempts"
              exit 1
            fi
          fi
