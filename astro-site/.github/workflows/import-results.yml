name: Import Results (南関競馬)

on:
  repository_dispatch:
    types: [results-updated]
  workflow_dispatch:
    inputs:
      date:
        description: '日付 (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Import results and verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_ENDPOINT: https://keiba-intelligence.netlify.app/.netlify/functions/send-alert
          CI: 'true'
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/importResults.js --date "${{ github.event.inputs.date }}"
          else
            node scripts/importResults.js
          fi

      - name: Rebuild archive (auto-recovery)
        run: |
          echo "🔄 Rebuilding archive to ensure consistency..."
          npm run rebuild:archive

      - name: Validate archive format
        run: npm run validate:archive

      - name: Verify archive sync (MANDATORY)
        run: |
          echo "🔍 Verifying archive sync with keiba-data-shared..."
          npm run verify:sync

      - name: Commit and push
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/archiveResults.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            COMMIT_DATE="${{ github.event.inputs.date }}"
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            fi
            git commit -m "Auto-verify: ${COMMIT_DATE} results from keiba-data-shared"

            # Retry logic: pull --rebase and push (最大5回リトライ)
            MAX_RETRIES=5
            RETRY_COUNT=0
            SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
              echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Pulling latest changes..."

              # archiveResults.jsonを退避（競合時に再生成版を優先するため）
              if [ -f "src/data/archiveResults.json" ]; then
                cp src/data/archiveResults.json /tmp/archiveResults.json.backup
                echo "📦 archiveResults.json backed up"
              fi

              # mainブランチにいることを確認
              CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
              if [ "$CURRENT_BRANCH" != "main" ]; then
                echo "⚠️  Not on main branch (current: $CURRENT_BRANCH), checking out main..."
                git checkout main
              fi

              # rebase中の競合を検出してabort + クリーンアップ
              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                echo "⚠️  Detected ongoing rebase, aborting..."
                git rebase --abort || true
              fi

              # merge中の競合を検出してabort
              if git ls-files -u | grep -q .; then
                echo "⚠️  Detected unmerged files, aborting merge..."
                git merge --abort || true
              fi

              # 最新状態を取得（fetch only, no reset）
              git fetch origin main

              # 最新状態を取得（rebase）
              if git pull --rebase origin main; then
                # archiveResults.jsonが競合した場合、バックアップから復元
                if [ -f "/tmp/archiveResults.json.backup" ] && ! git diff --quiet src/data/archiveResults.json 2>/dev/null; then
                  echo "📦 Restoring updated archiveResults.json from backup"
                  cp /tmp/archiveResults.json.backup src/data/archiveResults.json
                  git add src/data/archiveResults.json
                fi
                echo "✅ Successfully pulled latest changes"

                # プッシュ試行
                if git push; then
                  echo "✅ Successfully pushed changes"
                  SUCCESS=true
                  echo "committed=true" >> $GITHUB_OUTPUT
                  echo "date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
                else
                  echo "⚠️  Push failed, retrying..."
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                  sleep $((RETRY_COUNT * 2))
                fi
              else
                # rebase失敗時の処理
                echo "⚠️  Pull --rebase failed"

                # 競合が発生している場合は自動解決を試みる
                if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                  echo "🔧 Attempting to resolve conflicts automatically..."

                  # 競合ファイルをチェック
                  CONFLICT_FILES=$(git diff --name-only --diff-filter=U)

                  if [ -n "$CONFLICT_FILES" ]; then
                    echo "   Conflicted files: $CONFLICT_FILES"

                    # archiveResults.jsonの競合は再生成版を優先
                    for FILE in $CONFLICT_FILES; do
                      if [[ "$FILE" == src/data/archiveResults.json ]]; then
                        echo "   Resolving $FILE (using regenerated version)"
                        if [ -f "/tmp/archiveResults.json.backup" ]; then
                          cp /tmp/archiveResults.json.backup src/data/archiveResults.json
                          git add "$FILE"
                          echo "   ✅ Applied regenerated archiveResults.json"
                        else
                          echo "   ⚠️ Backup not found, using ours strategy as fallback"
                          git checkout --ours "$FILE"
                          git add "$FILE"
                        fi
                      fi
                    done

                    # rebase続行
                    if git rebase --continue; then
                      echo "✅ Conflicts resolved, rebase continued"
                      # Push試行（次のループではなく即座に）
                      if git push; then
                        echo "✅ Successfully pushed changes"
                        SUCCESS=true
                        echo "committed=true" >> $GITHUB_OUTPUT
                        echo "date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
                        break
                      else
                        echo "⚠️  Push failed after conflict resolution, retrying..."
                      fi
                    else
                      echo "❌ Failed to continue rebase, aborting..."
                      git rebase --abort || true
                    fi
                  else
                    echo "❌ No conflict files found but rebase failed, aborting..."
                    git rebase --abort || true
                  fi
                fi

                RETRY_COUNT=$((RETRY_COUNT + 1))
                sleep $((RETRY_COUNT * 2))
              fi
            done

            if [ "$SUCCESS" = false ]; then
              echo "❌ $MAX_RETRIES回のリトライ後も失敗"
              exit 1
            fi
          fi

      - name: Trigger Netlify Deploy
        if: steps.commit.outputs.committed == 'true'
        run: |
          curl -X POST -d '{}' ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          echo "✅ Netlify deploy triggered"

      - name: Send success notification
        if: steps.commit.outputs.committed == 'true' && success()
        run: |
          curl -X POST https://keiba-intelligence.netlify.app/.netlify/functions/send-alert \
            -H "Content-Type: application/json" \
            -d '{
              "type": "results_imported",
              "date": "${{ steps.commit.outputs.date }}",
              "status": "success",
              "message": "✅ ${{ steps.commit.outputs.date }}の結果を自動インポートしました"
            }' || true

      - name: Send failure notification
        if: failure()
        run: |
          curl -X POST https://keiba-intelligence.netlify.app/.netlify/functions/send-alert \
            -H "Content-Type: application/json" \
            -d '{
              "type": "results_import_failed",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "status": "failure",
              "message": "❌ 結果の自動インポートに失敗しました"
            }' || true
