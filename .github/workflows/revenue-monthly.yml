# 月間売上の measurement（KAO D-158・kao.revenue-month/v1）
#
# - 毎月 1 日 09:30 JST に前月分を集計し、docs/measurements/revenue-YYYY-MM-01.json を main へ commit する。
# - 毎週月曜 09:30 JST に当月分（月途中の速報値・partial: true）を同じ file へ commit する。月 100 万円に対する当月の伸び・停滞を
#   月末を待たずに KAO の MK report で見るため。1 日の確定値（partial なし）が同じ file を上書きする。月曜が 1 日なら速報は出さない。
# - KAO はこの file を canon（origin/main）から読み、MK report の「事業成果」節に出す。
# - 🔴 read-only の集計（Stripe へ書き込まない）。出力は集計値だけ（顧客・明細を含めない）。
# - 🔴 鍵は read-only の restricted key（STRIPE_REVENUE_READ_KEY）。未設定なら fail-closed で何も書かない。
name: Revenue monthly measurement

on:
  schedule:
    - cron: '30 0 1 * *'   # 毎月 1 日 00:30 UTC = 09:30 JST
    - cron: '30 0 * * 1'   # 毎週月曜 00:30 UTC = 09:30 JST（当月の速報値）
  workflow_dispatch:
    inputs:
      month:
        description: '対象月 YYYY-MM（省略時は JST の前月）'
        required: false
      dry_run:
        description: 'true なら集計値を log に出すだけで commit しない（当月は月途中の速報値）'
        required: false
        default: 'false'

concurrency:
  group: revenue-monthly
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build measurement
        working-directory: astro-site
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_REVENUE_READ_KEY }}
          MONTH_INPUT: ${{ github.event.inputs.month }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "❌ secret STRIPE_REVENUE_READ_KEY が未設定（read-only の restricted key を登録する）"
            exit 1
          fi
          if [ "$SCHEDULE" = "30 0 * * 1" ]; then
            # 週次の速報: 1 日は月次の確定値の日なので出さない（当月はまだ 0 時間分しか無い）
            if [ "$(TZ=Asia/Tokyo date +%d)" = "01" ]; then
              echo "⏭️  1 日は月次の確定値だけを出す"
              echo "SKIP=true" >> "$GITHUB_ENV"
              exit 0
            fi
            MONTH="$(TZ=Asia/Tokyo date +%Y-%m)"
          else
            MONTH="${MONTH_INPUT:-$(TZ=Asia/Tokyo date -d "$(TZ=Asia/Tokyo date +%Y-%m-01) -1 day" +%Y-%m)}"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/revenueMonthly.mjs --month "$MONTH" --dry-run | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s))))'
          else
            node scripts/revenueMonthly.mjs --month "$MONTH" --out "../docs/measurements/revenue-${MONTH}-01.json"
          fi
          echo "MONTH=$MONTH" >> "$GITHUB_ENV"

      - name: Commit measurement
        if: github.event.inputs.dry_run != 'true' && env.SKIP != 'true'
        run: |
          git add "docs/measurements/revenue-${MONTH}-01.json"
          if git diff --staged --quiet; then
            echo "⏭️  変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "measurement: revenue ${MONTH} (KAO D-158)"
          git push origin HEAD:main
