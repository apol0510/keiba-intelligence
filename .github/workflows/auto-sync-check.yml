name: Auto Sync Check (Fallback)

on:
  schedule:
    # 毎日 JST 1:00 (UTC 16:00) に実行（保険として）
    - cron: '0 16 * * *'
  workflow_dispatch:

# 並行実行制御：archive更新系workflowで統一
concurrency:
  group: archive-nankan-update
  cancel-in-progress: false

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        working-directory: astro-site
        run: npm ci

      # exit 0  … 同期OK（何もしない）
      # exit 75 … 一時エラー（rate limit/timeout/5xx）で判定不能＝deferred。
      #           「同期ズレ」ではないので自動修復へ進まない。run も落とさない。
      # その他  … 同期ズレの可能性（または token/認証）→ 下の detect-missing で確定させる
      #
      # continue-on-error は使わない。outcome は success/failure の 2 値しか無く、
      # deferred(75) と 実ズレ(1) を区別できないため、rc をそのまま output へ渡す。
      - name: Check sync status
        id: check-sync
        working-directory: astro-site
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          echo "🔍 Checking sync status..."
          if npm run verify:sync; then RC=0; else RC=$?; fi
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 75 ]; then
            echo "⏸️  verify:sync: 一時的に shared を取得できず判定不能（deferred）。次回実行で再判定。"
          fi
          exit 0

      - name: Detect missing dates
        id: detect-missing
        if: steps.check-sync.outputs.rc != '0' && steps.check-sync.outputs.rc != '75'
        working-directory: astro-site
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          echo "🔍 Detecting missing dates..."

          # 過去7日分の日付をチェック
          MISSING_DATES=""
          DEFERRED_DATES=""
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)

          for i in {1..7}; do
            CHECK_DATE=$(TZ=Asia/Tokyo date -d "$TODAY - $i days" +%Y-%m-%d 2>/dev/null || date -v-${i}d +%Y-%m-%d)

            # 認証付きで per-venue 存在確認（匿名 curl は廃止）。
            # exit 0 … 判定できた / exit 2 … 一時エラーで判定不能＝その日はスキップ（次回再試行）
            # exit 1 … token/認証/権限/契約違反＝運用者の対応が要る fatal
            if OUTPUT=$(node scripts/checkSharedNankanResults.mjs --date "$CHECK_DATE" --venues OOI,FUN,KAW,URA); then
              RC=0
            else
              RC=$?
            fi
            if [ "$RC" -eq 2 ]; then
              echo "⏸️  $CHECK_DATE: 一時エラーで判定不能（deferred・次回実行で再試行）"
              DEFERRED_DATES="${DEFERRED_DATES:+$DEFERRED_DATES,}$CHECK_DATE"
              continue
            fi
            if [ "$RC" -ne 0 ]; then
              echo "❌ checkSharedNankanResults failed (auth/token/permission error)"
              exit 1
            fi
            TOTAL_RACES=$(echo "$OUTPUT" | grep '^TOTAL_RACES=' | cut -d= -f2-)
            if [ -z "$TOTAL_RACES" ]; then
              echo "❌ TOTAL_RACES missing from checker output (contract violation)"
              exit 1
            fi

            if [ "$TOTAL_RACES" -ge 12 ]; then
              # archiveResults.json に存在するか確認
              if ! jq -e --arg date "$CHECK_DATE" '.[] | select(.date == $date)' src/data/archiveResults.json > /dev/null; then
                echo "❌ Missing: $CHECK_DATE"
                if [ -z "$MISSING_DATES" ]; then
                  MISSING_DATES="$CHECK_DATE"
                else
                  MISSING_DATES="$MISSING_DATES,$CHECK_DATE"
                fi
              fi
            fi
          done

          if [ -n "$DEFERRED_DATES" ]; then
            echo "⏸️  一時エラーで未判定の日付: $DEFERRED_DATES（次回実行で再判定）"
          fi

          if [ -n "$MISSING_DATES" ]; then
            echo "missing_dates=$MISSING_DATES" >> $GITHUB_OUTPUT
            echo "has_missing=true" >> $GITHUB_OUTPUT
            echo "🔴 Missing dates detected: $MISSING_DATES"
          else
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "✅ No missing dates"
          fi

      # exit 75 = 一時エラーで取込未完了＝deferred。書き終えた日ぶんは commit し、
      # 未完了の日は次回 schedule で再試行する。run は failure にしない。
      - name: Auto-import missing dates
        id: auto-import
        if: steps.detect-missing.outputs.has_missing == 'true'
        working-directory: astro-site
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          MISSING_DATES="${{ steps.detect-missing.outputs.missing_dates }}"
          IFS=',' read -ra DATES <<< "$MISSING_DATES"

          DEFERRED=false
          for DATE in "${DATES[@]}"; do
            echo "━━━ Auto-importing: $DATE ━━━"
            if npm run import:results -- --date "$DATE"; then
              RC=0
            else
              RC=$?
            fi
            if [ "$RC" -eq 75 ]; then
              echo "⏸️  import:results $DATE: 一時的に shared を取得できず未完了（deferred）。次回実行で再試行。"
              DEFERRED=true
            elif [ "$RC" -ne 0 ]; then
              exit "$RC"
            fi
          done
          echo "deferred=$DEFERRED" >> "$GITHUB_OUTPUT"

      # verify:sync は「取込後もまだズレている」ことの確認。
      # exit 75（一時エラーで確認できない）と、取込 deferred で残っているズレは failure にしない。
      - name: Validate and verify
        if: steps.detect-missing.outputs.has_missing == 'true'
        working-directory: astro-site
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
          IMPORT_DEFERRED: ${{ steps.auto-import.outputs.deferred }}
        run: |
          echo "🔍 Validating archive format..."
          npm run validate:archive

          echo "🔍 Verifying archive sync..."
          if npm run verify:sync; then RC=0; else RC=$?; fi
          if [ "$RC" -eq 75 ]; then
            echo "⏸️  verify:sync: 一時的に shared を取得できず確認不能（deferred）。次回実行で再確認。"
            exit 0
          fi
          if [ "$RC" -ne 0 ] && [ "$IMPORT_DEFERRED" = "true" ]; then
            echo "⏸️  取込が deferred のためズレが残っている（想定内）。次回実行で再試行。"
            exit 0
          fi
          exit "$RC"

      - name: Commit and push
        if: steps.detect-missing.outputs.has_missing == 'true'
        working-directory: astro-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/archiveResults.json

          if git diff --staged --quiet; then
            echo "⏭️  No changes to commit"
            exit 0
          fi

          MISSING_DATES="${{ steps.detect-missing.outputs.missing_dates }}"

          git commit -m "$(cat <<'EOF'
          🔧 Auto-sync fallback: ${MISSING_DATES}

          【自動修復】
          sync check で不足日を検出し、自動インポートを実行しました。

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>
          EOF
          )"

          git push

      - name: Success notification
        if: steps.detect-missing.outputs.has_missing == 'true'
        run: |
          echo "✅ Auto-sync fallback completed"
          echo "   Missing dates: ${{ steps.detect-missing.outputs.missing_dates }}"
          echo "   Successfully imported and pushed to main"

      - name: Already synced notification
        if: steps.check-sync.outputs.rc == '0'
        run: |
          echo "✅ Archive already in sync"
          echo "   No action needed"

      # 一時エラーで判定できなかった run は「異常なし」でも「異常あり」でもない。
      # 人間の対応は不要なので run は success のまま、状態だけ明示する。
      - name: Deferred notification
        if: steps.check-sync.outputs.rc == '75'
        run: |
          echo "⏸️  一時エラー（rate limit / timeout / 5xx）のため同期判定を見送りました"
          echo "   人間の対応は不要です。次回の schedule 実行で再判定されます。"
