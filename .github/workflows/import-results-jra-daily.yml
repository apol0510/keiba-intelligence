name: Import JRA Results Daily Check

on:
  schedule:
    # 毎日 23:30 JST (14:30 UTC) に実行
    - cron: '30 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [jra-results-updated]

# 並行実行制御：archiveResultsJra.json更新系workflowで統一（同じファイルへの同時コミット防止）
concurrency:
  group: archive-jra-update
  cancel-in-progress: false

jobs:
  check-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Get current date (JST)
        id: date
        env:
          PAYLOAD_DATE: ${{ github.event.client_payload.date }}
        run: |
          # repository_dispatchで日付が指定されている場合はそれを使用
          if [ -n "$PAYLOAD_DATE" ] && [ "$PAYLOAD_DATE" != "null" ]; then
            DATE="$PAYLOAD_DATE"
            echo "📅 Using date from repository_dispatch: $DATE"
          else
            # schedule実行時：GitHub Actionsの遅延でJST日付をまたぐと
            # 「実行時点の今日」だと前日(本来の対象日)を取り逃がす。
            # 6時間引いた業務日を対象にすることで遅延を吸収する。
            #   - 23:30 JST 正常実行 → 6h引いても同日 → その日を対象
            #   - 02:23 JST 翌日に遅延実行 → 6h引いて前日 → 本来の対象日を維持
            DATE=$(TZ=Asia/Tokyo date -d '6 hours ago' +%Y-%m-%d)
            echo "📅 Target date (JST, -6h to absorb schedule delay): $DATE"
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Check for missing results
        id: check
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          YEAR="${DATE:0:4}"
          MONTH="${DATE:5:2}"

          # 認証付き per-venue JRA 結果確認（匿名 curl は廃止）。
          # exit 0 … 判定できた（FOUND の真偽を問わない）
          # exit 2 … 一時エラー（rate limit/timeout/5xx）で確定不能＝deferred。
          #          取込は見送るが run は落とさない（次回 schedule で再判定される）
          # exit 1 … token / 認証 / 権限 / 契約違反＝fail-closed（results 無しと誤判定しない）
          if OUTPUT=$(node scripts/checkSharedJraResults.mjs --date "$DATE"); then
            CHECK_RC=0
          else
            CHECK_RC=$?
          fi
          if [ "$CHECK_RC" -eq 2 ]; then
            echo "⏸️  一時エラーのため JRA 結果の有無を判定できず、取込を見送る（次回 schedule で再判定）"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "alert_needed=false" >> $GITHUB_OUTPUT
            echo "deferred=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$CHECK_RC" -ne 0 ]; then
            echo "❌ checkSharedJraResults failed (auth/token/permission error)"
            exit 1
          fi
          FOUND_CODES=$(echo "$OUTPUT" | grep '^FOUND_CODES=' | cut -d= -f2-)
          TOTAL_RACES_RAW=$(echo "$OUTPUT" | grep '^TOTAL_RACES=' | cut -d= -f2-)
          if [ -z "$TOTAL_RACES_RAW" ]; then
            echo "❌ TOTAL_RACES missing from checker output (contract violation)"
            exit 1
          fi
          # FOUND_CODES（スペース区切り）→ 配列化。空文字は 0 要素として明示的に処理する。
          if [ -z "$FOUND_CODES" ]; then
            FOUND_VENUES=()
            EXPECTED_VENUES=0
          else
            read -ra FOUND_VENUES <<< "$FOUND_CODES"
            EXPECTED_VENUES="${#FOUND_VENUES[@]}"
          fi

          echo "🔍 per-venue検索結果: ${EXPECTED_VENUES}会場 (${FOUND_VENUES[*]})"

          # racebook（予想）が存在するかも確認 → 「開催想定日」判定に使う（認証付き Node checker）
          # racebook あり・結果なし = 取込漏れ（要アラート）
          # exit 2（一時エラー）は「racebook 無し」と誤判定せず、取込判定ごと見送る。
          if RB_OUTPUT=$(node scripts/checkSharedJraPredictions.mjs --date "$DATE"); then
            RB_RC=0
          else
            RB_RC=$?
          fi
          if [ "$RB_RC" -eq 2 ]; then
            echo "⏸️  一時エラーのため racebook の有無を判定できず、取込を見送る（次回 schedule で再判定）"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            echo "alert_needed=false" >> $GITHUB_OUTPUT
            echo "deferred=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$RB_RC" -ne 0 ]; then
            echo "❌ checkSharedJraPredictions failed (auth/token/permission error)"
            exit 1
          fi
          RB_CODES=$(echo "$RB_OUTPUT" | grep '^RACEBOOK_CODES=' | cut -d= -f2-)
          if [ -z "$RB_CODES" ]; then
            RACEBOOK_VENUES=()
          else
            read -ra RACEBOOK_VENUES <<< "$RB_CODES"
          fi
          echo "📚 racebook検索結果: ${#RACEBOOK_VENUES[@]}会場 (${RB_CODES})"

          if [ "$EXPECTED_VENUES" -eq 0 ]; then
            echo "⏭️  No JRA results in keiba-data-shared yet (全会場404)"
            echo "has_missing=false" >> $GITHUB_OUTPUT
            # racebook はあるのに結果がない = 取込漏れアラート
            # ただし安全弁: 対象日 18:00 JST(JRA最終R終了見込み)未満なら
            # レース未開催/開催中の「結果なし」は正常なので抑止する
            # （workflow_dispatch等での早期実行による誤アラート防止）
            if [ "${#RACEBOOK_VENUES[@]}" -gt 0 ]; then
              NOW_EPOCH=$(TZ=Asia/Tokyo date +%s)
              GATE_EPOCH=$(TZ=Asia/Tokyo date -d "$DATE 18:00" +%s)
              if [ "$NOW_EPOCH" -ge "$GATE_EPOCH" ]; then
                echo "🚨 racebookあり・結果なし → 取込漏れアラート対象"
                echo "missing_results_alert=true" >> $GITHUB_OUTPUT
                echo "racebook_venues=${RACEBOOK_VENUES[*]}" >> $GITHUB_OUTPUT
              else
                echo "⏭️  対象日($DATE)のレース終了前(18:00 JST未到達)のため結果未登録アラートを抑止"
                echo "missing_results_alert=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "missing_results_alert=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "missing_results_alert=false" >> $GITHUB_OUTPUT
            echo "✅ Results found in keiba-data-shared: $EXPECTED_VENUES venues"

            # アーカイブに既に存在するかチェック
            if grep -q "\"date\": \"$DATE\"" src/data/archiveResultsJra.json; then
              # アーカイブの会場数を取得
              ARCHIVED_VENUES=$(node -e "const data = JSON.parse(require('fs').readFileSync('src/data/archiveResultsJra.json', 'utf8')); const entry = data.find(e => e.date === '$DATE'); console.log(entry ? entry.venues.length : 0);")
              echo "   Archived venues: $ARCHIVED_VENUES"

              if [ "$ARCHIVED_VENUES" -ge "$EXPECTED_VENUES" ]; then
                echo "⏭️  Already processed with all venues: $DATE"
                echo "has_missing=false" >> $GITHUB_OUTPUT
              else
                echo "📥 Missing venues detected (archived: $ARCHIVED_VENUES, expected: $EXPECTED_VENUES)"
                echo "has_missing=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "📥 Missing from archive: $DATE"
              echo "has_missing=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Import missing results
        if: steps.check.outputs.has_missing == 'true'
        env:
          KEIBA_DATA_SHARED_TOKEN: ${{ secrets.KEIBA_DATA_SHARED_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing JRA results for: $DATE"
          # exit 75 (EX_TEMPFAIL) = rate limit / timeout / 5xx で今は確定できない＝deferred。
          # 未書込なので途中状態は残らない。run を failure にせず次回の自動実行へ委ねる。
          # exit 1 等（auth / 権限 / schema / 検証失敗）は従来どおり失敗させる。
          if node scripts/importResultsJra.js --date "$DATE"; then
            RC_importResultsJra=0
          else
            RC_importResultsJra=$?
          fi
          if [ "$RC_importResultsJra" -eq 75 ]; then
            echo "⏸️  importResultsJra: 一時的に shared を取得できず未完了（deferred）。次回実行で再試行。"
          elif [ "$RC_importResultsJra" -ne 0 ]; then
            exit "$RC_importResultsJra"
          fi

      - name: Check for changes
        id: git-check
        if: steps.check.outputs.has_missing == 'true'
        run: |
          git add src/data/archiveResultsJra.json
          git diff --staged --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.date.outputs.date }}"
          COMMIT_MSG="Auto-verify: ${DATE} JRA results (daily check)"

          # 変更ファイルを退避
          cp src/data/archiveResultsJra.json /tmp/archiveResultsJra.json.backup
          echo "📦 Backed up archiveResultsJra.json"

          # Retry logic: reset → restore → commit → push（最大5回リトライ）
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"

            # 1. 完全同期：origin/mainの最新状態にリセット
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "✅ Synced to origin/main ($(git rev-parse --short HEAD))"

            # 2. 退避ファイルを復元
            cp /tmp/archiveResultsJra.json.backup src/data/archiveResultsJra.json

            # 3. ステージング＆コミット
            git add src/data/archiveResultsJra.json
            if git diff --staged --quiet; then
              echo "⏭️  No changes after sync (remote already has latest)"
              SUCCESS=true
              break
            fi
            git commit -m "$COMMIT_MSG"

            # 4. プッシュ
            if git push origin main; then
              echo "✅ Successfully pushed changes"
              SUCCESS=true
            else
              echo "⚠️  Push failed (remote updated during attempt)"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep 2
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Success notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ JRA results imported and pushed (daily check)"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Trigger: scheduled (23:30 JST)"

      - name: No changes notification
        if: steps.check.outputs.has_missing != 'true'
        run: |
          echo "⏭️  No missing JRA results to import"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Archive is up-to-date"

      - name: Send alert (racebook exists but results missing)
        if: steps.check.outputs.missing_results_alert == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨 JRA結果データ未登録検出（23:30 JST チェック）'
          EMAIL_BODY: |
            マコさん、

            JRA予想（racebook）は keiba-data-shared に登録されていますが、
            ${{ steps.date.outputs.date }} の結果データが未登録です。

            【予想あり会場】
            ${{ steps.check.outputs.racebook_venues }}

            【結果なし】
            keiba-data-shared/jra/results/ に該当日のファイルがありません

            【対応方法】
            keiba-data-shared-admin の管理画面から JRA 結果を取込んでください：
            https://keiba-data-shared-admin.netlify.app/admin/results-manager-jra-batch

            または scripts/jra/auto-fetch-jra-official.mjs を実行してください。

            【GitHub Actionsログ】
            https://github.com/apol0510/keiba-intelligence/actions

            ---
            このメールは自動送信されています。
            ワークフロー: import-results-jra-daily.yml (23:30 JST)
        run: node "$GITHUB_WORKSPACE/.github/scripts/send-alert-email.js"
