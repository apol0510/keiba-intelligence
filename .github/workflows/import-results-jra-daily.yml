name: Import JRA Results Daily Check

on:
  schedule:
    # 毎日 23:30 JST (14:30 UTC) に実行
    - cron: '30 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [jra-results-updated]

# 並行実行制御：リポジトリ全体で1つのワークフローのみ実行（同じファイルへの同時コミット防止）
concurrency:
  group: import-results-jra-daily
  cancel-in-progress: false

jobs:
  check-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Get current date (JST)
        id: date
        env:
          PAYLOAD_DATE: ${{ github.event.client_payload.date }}
        run: |
          # repository_dispatchで日付が指定されている場合はそれを使用
          if [ -n "$PAYLOAD_DATE" ] && [ "$PAYLOAD_DATE" != "null" ]; then
            DATE="$PAYLOAD_DATE"
            echo "📅 Using date from repository_dispatch: $DATE"
          else
            DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
            echo "📅 Current date (JST): $DATE"
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Check for missing results
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"

          # keiba-data-sharedに結果データがあるかチェック
          RESULT_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/jra/results/${DATE:0:4}/${DATE:5:2}/${DATE}.json"

          echo "🔍 Checking for JRA results: $RESULT_URL"

          if curl -sf "$RESULT_URL" > /dev/null; then
            echo "✅ Results found in keiba-data-shared"

            # アーカイブに既に存在するかチェック
            if grep -q "\"date\": \"$DATE\"" src/data/archiveResultsJra.json; then
              echo "⏭️  Already processed: $DATE"
              echo "has_missing=false" >> $GITHUB_OUTPUT
            else
              echo "📥 Missing from archive: $DATE"
              echo "has_missing=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "⏭️  No results in keiba-data-shared yet"
            echo "has_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Import missing results
        if: steps.check.outputs.has_missing == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing JRA results for: $DATE"
          node scripts/importResultsJra.js --date "$DATE"

      - name: Check for changes
        id: git-check
        if: steps.check.outputs.has_missing == 'true'
        run: |
          git add src/data/archiveResultsJra.json
          git diff --staged --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.date.outputs.date }}"
          git commit -m "Auto-verify: ${DATE} JRA results (daily check)"

          # Retry logic with conflict resolution
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Pulling latest changes..."

            # rebase中の競合を検出してabort + クリーンアップ
            if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
              echo "⚠️  Detected ongoing rebase, aborting..."
              git rebase --abort
              # mainブランチに戻る（detached HEAD回避）
              git checkout main
              git reset --hard origin/main
              git clean -fd
            fi

            # マージ競合状態をチェック
            if git ls-files -u | grep -q .; then
              echo "⚠️  Detected unmerged files, resetting..."
              # mainブランチに戻る（detached HEAD回避）
              git checkout main
              git reset --hard origin/main
              git clean -fd
            fi

            # mainブランチにいることを確認
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "⚠️  Not on main branch (current: $CURRENT_BRANCH), checking out main..."
              git checkout main
            fi

            # 最新状態を取得（rebase）
            if git pull --rebase origin main; then
              echo "✅ Successfully pulled latest changes"

              # プッシュ試行
              if git push; then
                echo "✅ Successfully pushed changes"
                SUCCESS=true
              else
                echo "⚠️  Push failed, retrying..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                sleep $((RETRY_COUNT * 2))
              fi
            else
              # rebase失敗時の処理
              echo "⚠️  Pull --rebase failed"

              # 競合が発生している場合は自動解決を試みる
              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                echo "🔧 Attempting to resolve conflicts automatically..."

                # 競合ファイルをチェック
                CONFLICT_FILES=$(git diff --name-only --diff-filter=U)

                if [ -n "$CONFLICT_FILES" ]; then
                  echo "   Conflicted files: $CONFLICT_FILES"

                  # 結果データファイルの競合のみ自動解決（ours戦略: 自分の変更を優先）
                  for FILE in $CONFLICT_FILES; do
                    if [[ "$FILE" == astro-site/src/data/archiveResultsJra.json ]]; then
                      echo "   Resolving $FILE (using ours strategy)"
                      git checkout --ours "$FILE"
                      git add "$FILE"
                    fi
                  done

                  # rebase続行
                  if git rebase --continue; then
                    echo "✅ Conflicts resolved, rebase continued"
                    continue
                  else
                    echo "❌ Failed to continue rebase"
                    git rebase --abort
                    # mainブランチに戻る
                    git checkout main
                    git reset --hard origin/main
                  fi
                else
                  echo "❌ No conflict files found but rebase failed"
                  git rebase --abort
                  # mainブランチに戻る
                  git checkout main
                  git reset --hard origin/main
                fi
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep $((RETRY_COUNT * 2))
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Success notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ JRA results imported and pushed (daily check)"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Trigger: scheduled (23:30 JST)"

      - name: No changes notification
        if: steps.check.outputs.has_missing != 'true'
        run: |
          echo "⏭️  No missing JRA results to import"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Archive is up-to-date"
