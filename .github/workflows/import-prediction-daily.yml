name: Import Prediction (Daily Check)

on:
  schedule:
    # 毎日 23:00 JST = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:  # 手動実行も可能

# 並行実行制御：同じリポジトリのimport-daily-predictionは1つずつ実行
concurrency:
  group: import-prediction-daily-${{ github.ref }}
  cancel-in-progress: false  # 実行中のジョブをキャンセルせず待機

jobs:
  import-daily-prediction:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for git push
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Calculate JST date
        id: date
        run: |
          # JSTの現在日付を計算（UTC+9）
          JST_DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "date=$JST_DATE" >> $GITHUB_OUTPUT
          echo "📅 JST Today: $JST_DATE"

      - name: Import prediction from keiba-data-shared
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "🔄 Daily check: Importing prediction for $DATE"

          # import:prediction は日付未指定で JST 今日になるが、明示的に指定
          npm run import:prediction -- --date "$DATE"

      - name: Check for changes
        id: git-check
        run: |
          # 変更をステージング（新規ファイル + 既存ファイルの変更）
          git add src/data/predictions/
          # ステージされた変更があるかチェック
          git diff --staged --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.date.outputs.date }}"
          # 既に Check for changes ステップで git add 済み
          git commit -m "Daily auto-import: ${DATE} prediction [scheduled 23:00 JST]"

          # Retry logic: pull --rebase and push (最大5回リトライ)
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Pulling latest changes..."

            # rebase中の競合を検出してabort + クリーンアップ
            if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
              echo "⚠️  Detected ongoing rebase, aborting..."
              git rebase --abort
              # mainブランチに戻る（detached HEAD回避）
              git checkout main
              git reset --hard origin/main  # インデックスとワークツリーをクリア
              git reset --hard origin/main
              git clean -fd
            fi

            # マージ競合状態をチェック
            if git ls-files -u | grep -q .; then
              echo "⚠️  Detected unmerged files, resetting..."
              # mainブランチに戻る（detached HEAD回避）
              git checkout main
              git reset --hard origin/main  # インデックスとワークツリーをクリア
              git reset --hard origin/main
              git clean -fd
            fi

            # mainブランチにいることを確認
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            if [ "$CURRENT_BRANCH" != "main" ]; then
              echo "⚠️  Not on main branch (current: $CURRENT_BRANCH), checking out main..."
              git checkout main
            fi

            # 最新状態を取得（rebase）
            if git pull --rebase origin main; then
              echo "✅ Successfully pulled latest changes"

              # プッシュ試行
              if git push; then
                echo "✅ Successfully pushed changes"
                SUCCESS=true
              else
                echo "⚠️  Push failed, retrying..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                sleep $((RETRY_COUNT * 2))  # Exponential backoff
              fi
            else
              # rebase失敗時の処理
              echo "⚠️  Pull --rebase failed"

              # 競合が発生している場合は自動解決を試みる
              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                echo "🔧 Attempting to resolve conflicts automatically..."

                # 競合ファイルをチェック
                CONFLICT_FILES=$(git diff --name-only --diff-filter=U)

                if [ -n "$CONFLICT_FILES" ]; then
                  echo "   Conflicted files: $CONFLICT_FILES"

                  # 予想データファイルの競合のみ自動解決（ours戦略: 自分の変更を優先）
                  for FILE in $CONFLICT_FILES; do
                    if [[ "$FILE" == src/data/predictions/* ]]; then
                      echo "   Resolving $FILE (using ours strategy)"
                      git checkout --ours "$FILE"
                      git add "$FILE"
                    fi
                  done

                  # rebase続行
                  if git rebase --continue; then
                    echo "✅ Conflicts resolved, rebase continued"
                    # 次のループでpush試行
                    continue
                  else
                    echo "❌ Failed to continue rebase"
                    git rebase --abort
                    # mainブランチに戻る
                    git checkout main
                    git reset --hard origin/main  # インデックスとワークツリーをクリア
                    git reset --hard origin/main
                  fi
                else
                  echo "❌ No conflict files found but rebase failed"
                  git rebase --abort
                  # mainブランチに戻る
                  git checkout main
                  git reset --hard origin/main  # インデックスとワークツリーをクリア
                  git reset --hard origin/main
                fi
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep $((RETRY_COUNT * 2))
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Success notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ Daily import completed and pushed"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Trigger: scheduled (23:00 JST)"

      - name: No changes notification
        if: steps.git-check.outputs.changed != 'true'
        run: |
          echo "⏭️  No changes detected (already up-to-date)"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   This is expected if the main trigger already ran today"
