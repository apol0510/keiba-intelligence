name: Import Nankan Results Daily Check

on:
  schedule:
    # 毎日 23:30 JST (14:30 UTC) に実行
    - cron: '30 14 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [nankan-results-updated]

# 並行実行制御
concurrency:
  group: import-results-nankan-daily
  cancel-in-progress: false

jobs:
  check-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: astro-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'astro-site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Get current date (JST)
        id: date
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "📅 Current date (JST): $DATE"

      - name: Check for missing results
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"

          # keiba-data-sharedに結果データがあるかチェック
          RESULT_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/nankan/results/${DATE:0:4}/${DATE:5:2}/${DATE}.json"

          echo "🔍 Checking for Nankan results: $RESULT_URL"

          if curl -sf "$RESULT_URL" > /tmp/result.json; then
            RACE_COUNT=$(cat /tmp/result.json | jq -r '.races | length')
            echo "✅ Results found in keiba-data-shared: $RACE_COUNT races"

            # 12レース揃っている場合のみチェック
            if [ "$RACE_COUNT" -ge 12 ]; then
              # アーカイブに既に存在するかチェック
              if grep -q "\"date\": \"$DATE\"" src/data/archiveResults.json; then
                echo "⏭️  Already processed: $DATE"
                echo "has_missing=false" >> $GITHUB_OUTPUT
              else
                echo "📥 Missing from archive: $DATE"
                echo "has_missing=true" >> $GITHUB_OUTPUT
              fi
            else
              echo "⏭️  Skipped: $RACE_COUNT races (< 12)"
              echo "has_missing=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⏭️  No results in keiba-data-shared yet"
            echo "has_missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Import missing results
        if: steps.check.outputs.has_missing == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.date.outputs.date }}"
          echo "📥 Importing Nankan results for: $DATE"
          npm run import:results -- --date "$DATE"

      - name: Check for changes
        id: git-check
        if: steps.check.outputs.has_missing == 'true'
        run: |
          git add src/data/archiveResults.json
          git diff --staged --exit-code || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE="${{ steps.date.outputs.date }}"
          git commit -m "Auto-verify: ${DATE} Nankan results (daily check)"

          # Retry logic with conflict resolution
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Pulling latest changes..."

            # rebase中の競合を検出してabort + クリーンアップ
            if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
              echo "⚠️  Detected ongoing rebase, aborting..."
              git rebase --abort
              # 競合ファイルをリセット
              git reset --hard HEAD
              git clean -fd
            fi

            # マージ競合状態をチェック
            if git ls-files -u | grep -q .; then
              echo "⚠️  Detected unmerged files, resetting..."
              git reset --hard HEAD
              git clean -fd
            fi

            if git pull --rebase origin main; then
              echo "✅ Successfully pulled latest changes"

              if git push; then
                echo "✅ Successfully pushed changes"
                SUCCESS=true
              else
                echo "⚠️  Push failed, retrying..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                sleep $((RETRY_COUNT * 2))
              fi
            else
              echo "⚠️  Pull --rebase failed"

              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                echo "🔧 Attempting to resolve conflicts automatically..."

                CONFLICT_FILES=$(git diff --name-only --diff-filter=U)

                if [ -n "$CONFLICT_FILES" ]; then
                  echo "   Conflicted files: $CONFLICT_FILES"

                  for FILE in $CONFLICT_FILES; do
                    if [[ "$FILE" == astro-site/src/data/archiveResults.json ]]; then
                      echo "   Resolving $FILE (using ours strategy)"
                      git checkout --ours "$FILE"
                      git add "$FILE"
                    fi
                  done

                  if git rebase --continue; then
                    echo "✅ Conflicts resolved, rebase continued"
                    continue
                  else
                    echo "❌ Failed to continue rebase"
                    git rebase --abort
                  fi
                fi
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              sleep $((RETRY_COUNT * 2))
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Success notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ Nankan results imported and pushed (daily check)"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Trigger: scheduled (23:30 JST)"

      - name: No changes notification
        if: steps.check.outputs.has_missing != 'true'
        run: |
          echo "⏭️  No missing Nankan results to import"
          echo "   Date: ${{ steps.date.outputs.date }}"
          echo "   Archive is up-to-date"

      - name: Send failure alert
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: '🚨 南関結果自動インポート失敗 - keiba-intelligence'
          to: ${{ secrets.ALERT_EMAIL }}
          from: noreply@keiba-intelligence.netlify.app
          body: |
            マコさん、

            南関結果の自動インポート（定期チェック）が失敗しました。

            【対象日付】
            ${{ steps.date.outputs.date }}

            【失敗したステップ】
            ワークフロー: import-results-nankan-daily.yml

            【GitHub Actionsログ】
            https://github.com/apol0510/keiba-intelligence/actions/runs/${{ github.run_id }}

            【手動実行コマンド】
            cd /Users/apolon/Projects/keiba-intelligence
            gh workflow run import-results-on-dispatch.yml -f date=${{ steps.date.outputs.date }}

            ---
            このメールは自動送信されています。
