name: Verify Archive Sync (Daily)

on:
  schedule:
    # 毎日 0:00 JST (15:00 UTC 前日) に実行
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  verify-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keiba-intelligence (always freshest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JRA archive sync
        id: check-jra
        run: |
          # 過去7日間の日付をチェック
          MISSING_DATES=""
          NO_RESULTS_DATES=""
          ALERT_NEEDED=false
          NO_RESULTS_ALERT=false

          # JRA は per-venue ファイル構造（統合ファイル形式は使われていない）
          JRA_VENUE_CODES=("FKS" "HAN" "NAK" "TOK" "KYO" "CHU" "KOK" "NII" "SAP" "HKD" "HAK")

          for i in {0..6}; do
            DATE=$(date -u -d "$i days ago" +%Y-%m-%d 2>/dev/null || date -u -v-${i}d +%Y-%m-%d)
            YEAR=${DATE:0:4}
            MONTH=${DATE:5:2}

            echo "━━━ Checking: $DATE ━━━"

            # 予想データがあるかチェック（racebook の per-venue ファイルを優先、computer/ にフォールバック）
            HAS_PREDICTION=false
            PRED_VENUES_FOUND=()
            for V in "${JRA_VENUE_CODES[@]}"; do
              RB_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/jra/racebook/$YEAR/$MONTH/$DATE-$V.json"
              CP_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/jra/predictions/computer/$YEAR/$MONTH/$DATE-$V.json"
              if curl -sfI "$RB_URL" > /dev/null 2>&1 || curl -sfI "$CP_URL" > /dev/null 2>&1; then
                HAS_PREDICTION=true
                PRED_VENUES_FOUND+=("$V")
              fi
            done
            if [ "$HAS_PREDICTION" = true ]; then
              echo "✅ Prediction: Found (${PRED_VENUES_FOUND[*]})"
            else
              echo "⏭️  Prediction: Not found"
            fi

            # 結果データがあるかチェック（per-venue ファイルを集計）
            HAS_RESULT=false
            RACE_COUNT=0
            RESULT_VENUES_FOUND=()
            for V in "${JRA_VENUE_CODES[@]}"; do
              V_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/jra/results/$YEAR/$MONTH/$DATE-$V.json"
              if curl -sf "$V_URL" > /tmp/v_result.json; then
                V_COUNT=$(jq -r '.races | length' /tmp/v_result.json 2>/dev/null || echo 0)
                RACE_COUNT=$((RACE_COUNT + V_COUNT))
                HAS_RESULT=true
                RESULT_VENUES_FOUND+=("$V")
              fi
            done

            if [ "$HAS_RESULT" = true ]; then
              echo "✅ Results: $RACE_COUNT races (${RESULT_VENUES_FOUND[*]})"

              # 10レース以上ある場合のみチェック
              if [ "$RACE_COUNT" -ge 10 ]; then
                # アーカイブ検証（誤検知防止：最大3回リトライ、最後はraw.githubusercontentから直接確認）
                FOUND=false
                for ATTEMPT in 1 2 3; do
                  if grep -q "\"date\": \"$DATE\"" astro-site/src/data/archiveResultsJra.json; then
                    FOUND=true
                    break
                  fi
                  echo "⚠️  Archive grep attempt $ATTEMPT failed, re-fetching remote main..."
                  sleep 10
                  git fetch origin main --depth=1 2>/dev/null || true
                  git checkout origin/main -- astro-site/src/data/archiveResultsJra.json 2>/dev/null || true
                done
                # 最終フォールバック：raw.githubusercontentから直接チェック（キャッシュバイパス）
                if [ "$FOUND" = false ]; then
                  echo "🔄 Final check via raw.githubusercontent..."
                  REMOTE_URL="https://raw.githubusercontent.com/apol0510/keiba-intelligence/main/astro-site/src/data/archiveResultsJra.json?t=$(date +%s)"
                  if curl -sf -H "Cache-Control: no-cache" "$REMOTE_URL" | grep -q "\"date\": \"$DATE\""; then
                    FOUND=true
                    echo "✅ Archive: Found on remote (workspace was stale)"
                  fi
                fi
                if [ "$FOUND" = true ]; then
                  echo "✅ Archive: Found"
                else
                  echo "❌ Archive: MISSING! (confirmed after 3 retries + remote check)"
                  MISSING_DATES="${MISSING_DATES}${DATE} (${RACE_COUNT}R), "
                  ALERT_NEEDED=true
                fi
              else
                echo "⏭️  Skipped: $RACE_COUNT races (< 10)"
              fi
            else
              echo "⏭️  Results: Not found"

              # 予想データがあるのに結果データがない → アラート
              if [ "$HAS_PREDICTION" = true ]; then
                echo "🚨 PROBLEM: Prediction exists but NO results!"
                NO_RESULTS_DATES="${NO_RESULTS_DATES}${DATE}, "
                NO_RESULTS_ALERT=true
              fi
            fi
          done

          if [ "$ALERT_NEEDED" = true ]; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "missing_dates=${MISSING_DATES%, }" >> $GITHUB_OUTPUT
          else
            echo "alert_needed=false" >> $GITHUB_OUTPUT
          fi

          if [ "$NO_RESULTS_ALERT" = true ]; then
            echo "no_results_alert=true" >> $GITHUB_OUTPUT
            echo "no_results_dates=${NO_RESULTS_DATES%, }" >> $GITHUB_OUTPUT
            echo ""
            echo "🚨 ALERT: JRA dates with predictions but NO results!"
            echo "   $NO_RESULTS_DATES"
          else
            echo "no_results_alert=false" >> $GITHUB_OUTPUT
          fi

          if [ "$ALERT_NEEDED" = false ] && [ "$NO_RESULTS_ALERT" = false ]; then
            echo ""
            echo "✅ All dates synchronized"
          fi

      - name: Check Nankan archive sync
        id: check-nankan
        run: |
          # 過去7日間の日付をチェック
          MISSING_DATES=""
          NO_RESULTS_DATES=""
          ALERT_NEEDED=false
          NO_RESULTS_ALERT=false

          for i in {0..6}; do
            DATE=$(date -u -d "$i days ago" +%Y-%m-%d 2>/dev/null || date -u -v-${i}d +%Y-%m-%d)
            YEAR=${DATE:0:4}
            MONTH=${DATE:5:2}

            echo "━━━ Checking: $DATE ━━━"

            # 予想データがあるかチェック（統合ファイル優先、会場別ファイルもフォールバック）
            PREDICTION_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/nankan/predictions/$YEAR/$MONTH/$DATE.json"
            HAS_PREDICTION=false

            if curl -sf "$PREDICTION_URL" > /dev/null; then
              echo "✅ Prediction: Found"
              HAS_PREDICTION=true
            else
              for V in OOI FUN KAW URA; do
                if curl -sf "https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/nankan/predictions/$YEAR/$MONTH/$DATE-$V.json" > /dev/null; then
                  HAS_PREDICTION=true
                  break
                fi
              done
              if [ "$HAS_PREDICTION" = true ]; then
                echo "✅ Prediction: Found (会場別ファイル)"
              else
                echo "⏭️  Prediction: Not found"
              fi
            fi

            # 結果データがあるかチェック（統合ファイル優先、なければ会場別ファイルをマージ）
            RESULT_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/nankan/results/$YEAR/$MONTH/$DATE.json"
            HAS_RESULT=false
            RACE_COUNT=0
            if curl -sf "$RESULT_URL" > /tmp/result.json; then
              RACE_COUNT=$(cat /tmp/result.json | jq -r '.races | length')
              HAS_RESULT=true
            else
              # 会場別ファイル（OOI/FUN/KAW/URA）を個別確認してレース数を合算
              TOTAL=0
              for V in OOI FUN KAW URA; do
                V_URL="https://raw.githubusercontent.com/apol0510/keiba-data-shared/main/nankan/results/$YEAR/$MONTH/$DATE-$V.json"
                if curl -sf "$V_URL" > /tmp/v_result.json; then
                  V_COUNT=$(cat /tmp/v_result.json | jq -r '.races | length' 2>/dev/null || echo 0)
                  TOTAL=$((TOTAL + V_COUNT))
                  HAS_RESULT=true
                fi
              done
              RACE_COUNT=$TOTAL
              [ "$HAS_RESULT" = true ] && echo "   (会場別ファイルで検出: $RACE_COUNT races)"
            fi

            if [ "$HAS_RESULT" = true ]; then
              echo "✅ Results: $RACE_COUNT races"

              # 12レース揃っている場合のみチェック
              if [ "$RACE_COUNT" -ge 12 ]; then
                # アーカイブ検証（誤検知防止：最大3回リトライ、最後はraw.githubusercontentから直接確認）
                FOUND=false
                for ATTEMPT in 1 2 3; do
                  if grep -q "\"date\": \"$DATE\"" astro-site/src/data/archiveResults.json; then
                    FOUND=true
                    break
                  fi
                  echo "⚠️  Archive grep attempt $ATTEMPT failed, re-fetching remote main..."
                  sleep 10
                  git fetch origin main --depth=1 2>/dev/null || true
                  git checkout origin/main -- astro-site/src/data/archiveResults.json 2>/dev/null || true
                done
                if [ "$FOUND" = false ]; then
                  echo "🔄 Final check via raw.githubusercontent..."
                  REMOTE_URL="https://raw.githubusercontent.com/apol0510/keiba-intelligence/main/astro-site/src/data/archiveResults.json?t=$(date +%s)"
                  if curl -sf -H "Cache-Control: no-cache" "$REMOTE_URL" | grep -q "\"date\": \"$DATE\""; then
                    FOUND=true
                    echo "✅ Archive: Found on remote (workspace was stale)"
                  fi
                fi
                if [ "$FOUND" = true ]; then
                  echo "✅ Archive: Found"
                else
                  echo "❌ Archive: MISSING! (confirmed after 3 retries + remote check)"
                  MISSING_DATES="${MISSING_DATES}${DATE} (${RACE_COUNT}R), "
                  ALERT_NEEDED=true
                fi
              else
                echo "⏭️  Skipped: $RACE_COUNT races (< 12)"
              fi
            else
              echo "⏭️  Results: Not found"

              # 予想データがあるのに結果データがない → アラート
              if [ "$HAS_PREDICTION" = true ]; then
                echo "🚨 PROBLEM: Prediction exists but NO results!"
                NO_RESULTS_DATES="${NO_RESULTS_DATES}${DATE}, "
                NO_RESULTS_ALERT=true
              fi
            fi
          done

          if [ "$ALERT_NEEDED" = true ]; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "missing_dates=${MISSING_DATES%, }" >> $GITHUB_OUTPUT
          else
            echo "alert_needed=false" >> $GITHUB_OUTPUT
          fi

          if [ "$NO_RESULTS_ALERT" = true ]; then
            echo "no_results_alert=true" >> $GITHUB_OUTPUT
            echo "no_results_dates=${NO_RESULTS_DATES%, }" >> $GITHUB_OUTPUT
            echo ""
            echo "🚨 ALERT: Dates with predictions but NO results!"
            echo "   $NO_RESULTS_DATES"
          else
            echo "no_results_alert=false" >> $GITHUB_OUTPUT
          fi

          if [ "$ALERT_NEEDED" = false ] && [ "$NO_RESULTS_ALERT" = false ]; then
            echo ""
            echo "✅ All dates synchronized"
          fi

      - name: Send alert email (JRA)
        if: steps.check-jra.outputs.alert_needed == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨 JRA結果アーカイブ未反映検出 - keiba-intelligence'
          EMAIL_BODY: |
            マコさん、

            JRA結果データがkeiba-intelligenceのアーカイブに反映されていません。

            【未反映の日付】
            ${{ steps.check-jra.outputs.missing_dates }}

            【確認事項】
            1. keiba-data-sharedには結果データが存在します
            2. しかし、keiba-intelligenceのアーカイブに反映されていません

            【手動実行コマンド】
            cd /Users/apolon/Projects/keiba-intelligence
            gh workflow run import-results-jra.yml -f date=YYYY-MM-DD

            または、以下のURLから手動実行：
            https://github.com/apol0510/keiba-intelligence/actions/workflows/import-results-jra.yml

            【GitHub Actionsログ】
            https://github.com/apol0510/keiba-intelligence/actions

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node "$GITHUB_WORKSPACE/.github/scripts/send-alert-email.js"

      - name: Send alert email (JRA - No Results)
        if: steps.check-jra.outputs.no_results_alert == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨🚨 JRA結果データ未登録検出 - keiba-data-shared'
          EMAIL_BODY: |
            マコさん、

            JRA予想データは存在しますが、結果データがkeiba-data-sharedに登録されていません。

            【結果データが未登録の日付】
            ${{ steps.check-jra.outputs.no_results_dates }}

            【確認事項】
            1. keiba-data-sharedに予想データは存在します
            2. しかし、結果データが登録されていません

            【対応方法】
            1. 結果データをkeiba-data-sharedに登録してください
            2. 結果データのファイルパス:
               keiba-data-shared/jra/results/YYYY/MM/YYYY-MM-DD.json

            【keiba-data-sharedリポジトリ】
            https://github.com/apol0510/keiba-data-shared

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node "$GITHUB_WORKSPACE/.github/scripts/send-alert-email.js"

      - name: Send alert email (Nankan)
        if: steps.check-nankan.outputs.alert_needed == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨 南関結果アーカイブ未反映検出 - keiba-intelligence'
          EMAIL_BODY: |
            マコさん、

            南関結果データがkeiba-intelligenceのアーカイブに反映されていません。

            【未反映の日付】
            ${{ steps.check-nankan.outputs.missing_dates }}

            【確認事項】
            1. keiba-data-sharedには結果データが存在します（12レース揃い）
            2. しかし、keiba-intelligenceのアーカイブに反映されていません

            【手動実行コマンド】
            cd /Users/apolon/Projects/keiba-intelligence
            gh workflow run import-results-on-dispatch.yml -f date=YYYY-MM-DD

            または、以下のURLから手動実行：
            https://github.com/apol0510/keiba-intelligence/actions/workflows/import-results-on-dispatch.yml

            【GitHub Actionsログ】
            https://github.com/apol0510/keiba-intelligence/actions

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node "$GITHUB_WORKSPACE/.github/scripts/send-alert-email.js"

      - name: Send alert email (Nankan - No Results)
        if: steps.check-nankan.outputs.no_results_alert == 'true'
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          EMAIL_SUBJECT: '🚨🚨 南関結果データ未登録検出 - keiba-data-shared'
          EMAIL_BODY: |
            マコさん、

            南関予想データは存在しますが、結果データがkeiba-data-sharedに登録されていません。

            【結果データが未登録の日付】
            ${{ steps.check-nankan.outputs.no_results_dates }}

            【確認事項】
            1. keiba-data-sharedに予想データは存在します
            2. しかし、結果データが登録されていません

            【対応方法】
            1. 結果データをkeiba-data-sharedに登録してください
            2. 結果データのファイルパス:
               keiba-data-shared/nankan/results/YYYY/MM/YYYY-MM-DD.json

            【keiba-data-sharedリポジトリ】
            https://github.com/apol0510/keiba-data-shared

            ---
            このメールは自動送信されています。
            ワークフロー: verify-archive-sync.yml
        run: node "$GITHUB_WORKSPACE/.github/scripts/send-alert-email.js"

      - name: Success notification
        if: steps.check-jra.outputs.alert_needed != 'true' && steps.check-nankan.outputs.alert_needed != 'true'
        run: |
          echo "✅ All archives synchronized (past 7 days)"
          echo "   JRA: OK"
          echo "   Nankan: OK"
          echo "   No alerts sent"
